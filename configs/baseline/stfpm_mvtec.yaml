# STFPM Foundational Baseline Configuration (Wang et al., BMVC 2021)
experiment:
  name: "stfpm_mvtec_baseline"
  branch_owner: "foundational_baseline"
  seed: 42
  output_dir: "./outputs/stfpm_baseline"

dataset:
  name: "mvtec_ad"
  data_root: "/kaggle/input/mvtec-ad"
  img_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  core_categories:
    - "carpet"
    - "bottle"
    - "screw"

model:
  name: "stfpm"
  teacher_backbone: "resnet18"
  teacher_pretrained: true
  student_backbone: "resnet18"
  layers:
    - "layer1"
    - "layer2"
    - "layer3"

training:
  epochs: 100
  batch_size: 32
  optimizer: "sgd"
  lr: 0.4
  momentum: 0.9
  weight_decay: 0.0001
  shuffle: false
  drop_last: false
  num_workers: 2
  val_split_ratio: 0.2
  save_interval: 10

evaluation:
  target_size: [256, 256]
  metrics:
    - "auroc_img"
    - "ap_img"
    - "auroc_pix"
    - "ap_pix"
    - "aupro_30"
    - "aupro_05"
