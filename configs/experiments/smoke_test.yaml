# Stage 3 Pipeline Smoke Test Configuration (R00)
# Short 2-epoch run to validate forward/backward pass, checkpoint save/resume, and metrics.

experiment:
  name: "R00_smoke_test"
  branch_owner: "shared_baseline"
  seed: 42
  output_dir: "./outputs/smoke_test"

dataset:
  name: "mvtec_ad"
  data_root: "./datasets/mvtec"
  img_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  core_categories:
    - "carpet"
    - "bottle"

model:
  variant: "B0"
  teacher_backbone: "wide_resnet50_2"
  teacher_pretrained: true
  adapter_mode: "dense"
  gcm_conv_mode: "dense"

training:
  epochs: 2
  batch_size: 2
  lr: 0.005
  betas: [0.5, 0.999]
  weight_decay: 0.0
  shuffle: false
  drop_last: false
  num_workers: 0
  save_interval: 1
  eval_interval: 1

loss:
  lambda_same: 2.0
  lambda_cross: 0.1
  cross_scale_weights: [0.4, 0.2, 0.4]
  cross_loss_mode: "official_train"

inference:
  fusion_mode: "A0_baseline"
  same_weight: 2.0
  cross_weight: 0.1
  cross_scale_weights: [0.4, 0.2, 0.4]
  gaussian_sigma: 4.0
  image_score_mode: "max"
