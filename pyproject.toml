[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs331-anomaly-detection"
version = "0.1.0"
description = "Reproducible research on lightweight knowledge-distillation-based industrial anomaly detection, CDA baseline reproduction, and controlled experimental improvements."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quang Thanh (Researcher A)"},
    {name = "Luan (Researcher B)"}
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "Pillow>=9.5.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
